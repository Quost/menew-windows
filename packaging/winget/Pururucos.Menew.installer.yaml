# Template for the first winget submission (see README.md here). {{...}} is filled by release.yml.
# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json

PackageIdentifier: Pururucos.Menew
PackageVersion: {{VERSION}}
Platform:
- Windows.Desktop
MinimumOSVersion: 10.0.19041.0
# Velopack Setup.exe: per-user install in %LocalAppData%\Menew, no admin rights, updates itself afterwards
InstallerType: exe
Scope: user
InstallModes:
- silent
- silentWithProgress
InstallerSwitches:
  Silent: --silent
  SilentWithProgress: --silent
UpgradeBehavior: install
# Velopack registers the app under HKCU\...\Uninstall\Menew (the --packId)
ProductCode: Menew
AppsAndFeaturesEntries:
- DisplayName: Menew
  Publisher: Matheus Quost
  ProductCode: Menew
ReleaseDate: {{RELEASE_DATE}}
Installers:
- Architecture: x64
  InstallerUrl: {{X64_URL}}
  InstallerSha256: {{X64_SHA256}}
- Architecture: arm64
  InstallerUrl: {{ARM64_URL}}
  InstallerSha256: {{ARM64_SHA256}}
ManifestType: installer
ManifestVersion: 1.12.0
