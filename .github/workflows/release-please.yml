name: Release PR

# The maintainer never edits versions or tags by hand:
# 1. every push to main updates the "chore(release): X.Y.Z" PR (release-please, version from the Conventional
#    Commits). The PR bumps <Version> in Directory.Build.props, and the job below turns the "## Unreleased" notes
#    of CHANGELOG.md into "## X.Y.Z".
# 2. merging that PR creates the tag vX.Y.Z and a draft GitHub release, and this workflow calls release.yml, which
#    builds, packs, publishes the release and updates winget.
#
# Why release.yml is called from here and not left to its `push: tags` trigger: a tag (or PR, or commit) made with
# the GITHUB_TOKEN starts no other workflow, by GitHub's design, so the tag release-please creates would never
# trigger it. The same goes for CI on the release PR, which is why CI is started here with workflow_dispatch
# (allowed with the GITHUB_TOKEN): its check runs land on the PR's head commit and satisfy the required checks.
# No personal token is needed for any of this.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write # release-please creates and moves the "autorelease: pending/tagged" labels
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      prs_created: ${{ steps.rp.outputs.prs_created }}
      pr: ${{ steps.rp.outputs.pr }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: rp
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  changelog:
    name: Release PR changelog and CI
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true' && needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          persist-credentials: false
      - name: Unreleased notes become the version's section
        run: |
          version=$(python3 -c "import xml.etree.ElementTree as E; print(E.parse('Directory.Build.props').find('PropertyGroup/Version').text)")
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          python3 scripts/promote_changelog.py "$version" "$previous"
          if git diff --quiet -- CHANGELOG.md; then echo "CHANGELOG.md already has ## $version"; exit 0; fi
          git diff -- CHANGELOG.md
          # through the contents API, so the commit is signed by GitHub ("Verified"), like the Mac's Homebrew bump
          blob=$(gh api "repos/$GITHUB_REPOSITORY/contents/CHANGELOG.md?ref=$BRANCH" --jq .sha)
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/CHANGELOG.md" \
            -f message="docs(changelog): notes for $version" \
            -f content="$(base64 -w0 CHANGELOG.md)" \
            -f sha="$blob" -f branch="$BRANCH" --jq .commit.html_url
      - name: Run CI on the release PR
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"

  release:
    name: Release
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
