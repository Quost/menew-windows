name: Release

# A tag vX.Y.Z builds Menew for win-x64 and win-arm64, packs it with Velopack (installer, portable zip, full and
# delta packages, update feed), signs it when Azure Trusted Signing is set up, publishes the GitHub release with the
# CHANGELOG.md section as notes, and then updates winget.
#
# Normally called by release-please.yml when the release PR is merged (its tag, made with the GITHUB_TOKEN, cannot
# trigger this workflow by itself). A tag pushed by hand also works, and "Run workflow" re-runs an existing tag.
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: The tag to release, e.g. v0.1.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)release, e.g. v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  verify:
    name: Verify version and changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: The tag matches the project version and CHANGELOG.md has its section
        id: check
        run: |
          if ! [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::tag $TAG is not vX.Y.Z or vX.Y.Z-suffix"; exit 1
          fi
          version="${BASH_REMATCH[1]}"
          project=$(python3 -c "import xml.etree.ElementTree as E; print(E.parse('Directory.Build.props').find('PropertyGroup/Version').text)")
          if [ "$project" != "$version" ]; then
            echo "::error::tag $TAG does not match <Version>$project</Version> of Directory.Build.props"; exit 1
          fi
          notes=$(awk -v v="$version" '$0 == "## " v { found = 1; next } found && /^## / { exit } found { print }' CHANGELOG.md)
          if [ -z "$(printf '%s' "$notes" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md has no (or an empty) '## $version' section"; exit 1
          fi
          prerelease=false
          [[ "$version" == *-* ]] && prerelease=true
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Menew $version (prerelease: $prerelease)"

  build:
    name: Build (${{ matrix.rid }})
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: read
      # only used by the optional Azure Trusted Signing login (OIDC)
      id-token: write
    strategy:
      fail-fast: true
      matrix:
        rid: [win-x64, win-arm64]
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
      # Optional code signing, on by itself once these are set (Settings > Secrets and variables > Actions):
      # secrets AZURE_TENANT_ID and AZURE_CLIENT_ID (plus AZURE_CLIENT_SECRET, or a federated credential for this
      # repo's GitHub OIDC), variables AZURE_SIGNING_ENDPOINT (e.g. https://eus.codesigning.azure.net/),
      # AZURE_SIGNING_ACCOUNT and AZURE_SIGNING_PROFILE. Without them the release is unsigned (SmartScreen warns).
      SIGN: ${{ secrets.AZURE_TENANT_ID != '' && secrets.AZURE_CLIENT_ID != '' && vars.AZURE_SIGNING_ENDPOINT != '' && vars.AZURE_SIGNING_ACCOUNT != '' && vars.AZURE_SIGNING_PROFILE != '' }}
      SIGN_WITH_SECRET: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Release notes for the updater
        shell: bash
        run: |
          mkdir -p artifacts
          awk -v v="$VERSION" '$0 == "## " v { found = 1; next } found && /^## / { exit } found { print }' CHANGELOG.md > artifacts/notes.md
          cat artifacts/notes.md

      # ---- optional signing (Azure Trusted Signing) ----
      - name: Azure login for signing (OIDC)
        if: env.SIGN == 'true' && env.SIGN_WITH_SECRET != 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Signing metadata
        if: env.SIGN == 'true'
        shell: pwsh
        env:
          ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          @{ Endpoint = $env:ENDPOINT; CodeSigningAccountName = $env:ACCOUNT; CertificateProfileName = $env:PROFILE } |
            ConvertTo-Json | Set-Content -Encoding utf8 "$env:RUNNER_TEMP/trusted-signing.json"
          "SIGN_FILE=$env:RUNNER_TEMP/trusted-signing.json" >> $env:GITHUB_ENV
      - name: No signing
        if: env.SIGN != 'true'
        run: echo "::notice::Unsigned build (no Azure Trusted Signing secrets/variables); Windows SmartScreen will warn on first run."

      - name: Publish and pack (Native AOT, Velopack)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # read by Velopack's signing (DefaultAzureCredential) when the client secret flavor is used
          AZURE_TENANT_ID: ${{ env.SIGN == 'true' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ env.SIGN == 'true' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ env.SIGN == 'true' && secrets.AZURE_CLIENT_SECRET || '' }}
        run: |
          $params = @{ Rid = '${{ matrix.rid }}'; NotesFile = 'artifacts/notes.md'; PreviousFrom = "https://github.com/$env:GITHUB_REPOSITORY" }
          if ($env:PRERELEASE -eq 'true') { $params.Prerelease = $true }
          if ($env:SIGN_FILE) { $params.AzureTrustedSignFile = $env:SIGN_FILE }
          ./scripts/package.ps1 @params

      - name: Collect the release assets
        shell: pwsh
        run: |
          # only this version's files: assets.<rid>.json lists them (the downloaded previous package stays out),
          # plus the feed releases.<rid>.json, exactly what `vpk upload github` would upload
          $rid = '${{ matrix.rid }}'
          $out = New-Item -ItemType Directory -Force dist
          $listed = Get-Content "artifacts/releases/assets.$rid.json" | ConvertFrom-Json | ForEach-Object { $_.RelativeFileName }
          foreach ($name in @($listed) + "releases.$rid.json") { Copy-Item "artifacts/releases/$name" $out }
          Get-ChildItem dist | Format-Table Name, Length
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.rid }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SIGNED: ${{ secrets.AZURE_TENANT_ID != '' && secrets.AZURE_CLIENT_ID != '' && vars.AZURE_SIGNING_ENDPOINT != '' && vars.AZURE_SIGNING_ACCOUNT != '' && vars.AZURE_SIGNING_PROFILE != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Notes and checksums
        run: |
          cd dist
          sha256sum -- * | tee ../SHA256SUMS
          mv ../SHA256SUMS .
          cd ..
          {
            if [ "$SIGNED" != "true" ]; then
              printf '> **Not code-signed yet.** Windows SmartScreen may say "Windows protected your PC" the first time: click **More info**, then **Run anyway**. Menew updates itself after that.\n\n'
            fi
            awk -v v="$VERSION" '$0 == "## " v { found = 1; next } found && /^## / { exit } found { print }' CHANGELOG.md
            printf '\n### Download\n\n'
            printf -- '- **Installer:** [Menew-win-x64-Setup.exe](https://github.com/%s/releases/download/%s/Menew-win-x64-Setup.exe) (most PCs) or [Menew-win-arm64-Setup.exe](https://github.com/%s/releases/download/%s/Menew-win-arm64-Setup.exe) (ARM, e.g. Snapdragon)\n' "$GH_REPO" "$TAG" "$GH_REPO" "$TAG"
            # shellcheck disable=SC2016 # Markdown backticks, not a command
            printf -- '- **winget:** `winget install Pururucos.Menew`\n'
          } > RELEASE_NOTES.md
          cat RELEASE_NOTES.md
          ls -la dist
      - name: Create or complete the release, then publish it
        run: |
          latest=true
          [ "$PRERELEASE" = "true" ] && latest=false
          # release-please made a draft for this tag; a tag pushed by hand has none yet. Either way the release
          # stays a draft until every asset is uploaded, so the site and the updater never see a half release.
          # The API sometimes fails after doing the work, so each step is retried and safe to repeat.
          retry() { for i in 1 2 3 4; do "$@" && return 0; [ "$i" = 4 ] && return 1; echo "retrying in $((i * 10))s"; sleep $((i * 10)); done; }
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            retry gh release create "$TAG" --verify-tag --draft --title "Menew $VERSION" --notes-file RELEASE_NOTES.md --prerelease="$PRERELEASE"
          fi
          retry gh release edit "$TAG" --title "Menew $VERSION" --notes-file RELEASE_NOTES.md --prerelease="$PRERELEASE"
          retry gh release upload "$TAG" dist/* --clobber
          retry gh release edit "$TAG" --draft=false --latest="$latest"
          gh release view "$TAG" --json url,isDraft,isPrerelease,assets --jq '{url, isDraft, isPrerelease, assets: [.assets[].name]}'

  winget:
    name: winget
    needs: [verify, publish]
    # winget has no pre-release channel
    if: needs.verify.outputs.prerelease != 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
      GH_TOKEN: ${{ github.token }}
      PACKAGE: Pururucos.Menew
      WINGETCREATE_VERSION: 1.28.1.0
      WINGETCREATE_SHA256: 63d980ba79e97042395bd6eb5992c2db9e01e9e7a8a22958a95c288f27310413
    steps:
      - name: Check for WINGET_TOKEN
        id: token
        shell: pwsh
        run: |
          if (-not $env:WINGET_TOKEN) {
            "::notice::winget skipped: add a WINGET_TOKEN secret (classic personal access token with the public_repo scope) to open the winget-pkgs PR automatically. See packaging/winget/README.md."
            "skip=true" >> $env:GITHUB_OUTPUT
          }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.token.outputs.skip != 'true'
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: wingetcreate
        if: steps.token.outputs.skip != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/microsoft/winget-create/releases/download/v$env:WINGETCREATE_VERSION/wingetcreate.exe" -OutFile wingetcreate.exe
          if ((Get-FileHash wingetcreate.exe -Algorithm SHA256).Hash -ne $env:WINGETCREATE_SHA256) { throw 'wingetcreate.exe checksum mismatch' }
      - name: Open the winget-pkgs PR
        if: steps.token.outputs.skip != 'true'
        shell: pwsh
        run: |
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG"
          $x64 = "$base/Menew-win-x64-Setup.exe"
          $arm64 = "$base/Menew-win-arm64-Setup.exe"
          $notesUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$env:TAG"
          gh api "repos/microsoft/winget-pkgs/contents/manifests/p/Pururucos/Menew" --silent 2>$null
          if ($LASTEXITCODE -eq 0) {
            ./wingetcreate.exe update $env:PACKAGE --version $env:VERSION --urls "$x64|x64" "$arm64|arm64" `
              --release-notes-url $notesUrl --submit --token $env:WINGET_TOKEN
          } else {
            # first release: Pururucos.Menew is not in winget-pkgs yet, submit the manifests of packaging/winget
            Write-Host "::notice::$env:PACKAGE is new on winget: submitting the first manifest (a moderator reviews it by hand)."
            Invoke-WebRequest $x64 -OutFile x64.exe
            Invoke-WebRequest $arm64 -OutFile arm64.exe
            $values = @{
              '{{VERSION}}' = $env:VERSION; '{{RELEASE_DATE}}' = (Get-Date -AsUTC -Format 'yyyy-MM-dd'); '{{RELEASE_NOTES_URL}}' = $notesUrl
              '{{X64_URL}}' = $x64; '{{X64_SHA256}}' = (Get-FileHash x64.exe -Algorithm SHA256).Hash
              '{{ARM64_URL}}' = $arm64; '{{ARM64_SHA256}}' = (Get-FileHash arm64.exe -Algorithm SHA256).Hash
            }
            $out = New-Item -ItemType Directory -Force "winget/$env:VERSION"
            foreach ($file in Get-ChildItem packaging/winget -Filter *.yaml) {
              $text = Get-Content $file -Raw
              foreach ($key in $values.Keys) { $text = $text.Replace($key, $values[$key]) }
              Set-Content -Path (Join-Path $out $file.Name) -Value $text -Encoding utf8NoBOM -NoNewline
            }
            if (Get-Command winget -ErrorAction SilentlyContinue) { winget validate --manifest $out }
            ./wingetcreate.exe submit --token $env:WINGET_TOKEN $out
          }
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate exited with code $LASTEXITCODE" }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.token.outputs.skip != 'true' && always()
        with:
          name: winget-manifests
          path: winget/
          if-no-files-found: ignore
